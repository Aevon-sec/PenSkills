[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillspector"
version = "2.12.0"
description = "PenSkills: security scanner for AI agent skills, published at https://github.com/Aevon-sec/PenSkills. Scans skills for vulnerabilities, malicious patterns, prompt injection, and security risks before installation. Includes NVIDIA SkillSpector under Apache-2.0 (see NOTICE). Supports Git repos, URLs, zips, and local directories; runs static pattern checks and optional LLM semantic analysis; outputs terminal, JSON, Markdown, and SARIF reports with risk scoring."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Aevon-sec" }]
requires-python = ">=3.12,<3.16"
keywords = [
    "security",
    "ai-agents",
    "vulnerability-scanner",
    "claude-code",
    "skills",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Typer <0.24 uses click>=8.0.0; 0.24+ requires click>=8.2.1 which conflicts with semgrep (click 8.1.x)
    "typer>=0.23.0,<0.24",
    "rich>=14.3.0",
    "httpx>=0.28.0",
    "pywhatwgurl==0.1.1",
    "regex==2026.5.9",
    "packaging>=24.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.12.0",
    "openai>=2.25.0",
    "langgraph>=1.0.10",
    "langchain-anthropic>=1.4.5",
    "langchain-aws>=0.2.0",
    "langchain-core>=1.2.17",
    "langchain-openai>=1.1.10",
    "boto3>=1.34.0",
    "langsmith>=0.7.30",
    "yara-python>=4.5.0",
    "google-auth[requests]>=2.53.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.29.0,<2.0.0",
]
langgraph-dev = [
    "langgraph-cli[inmem]>=0.4.14",
]
dev = [
    "skillspector[mcp]",
    "skillspector[langgraph-dev]",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "build>=1.4.0",
    "hatchling>=1.31.0",
    "twine>=6.2.0",
    "poetry>=2.3.0",
]

[project.scripts]
penskills = "skillspector.cli_entry:app"
skillspector = "skillspector.cli_entry:app"

[tool.uv]
# uv tool install git+https://github.com/Aevon-sec/PenSkills.git

[project.urls]
Homepage = "https://github.com/Aevon-sec/PenSkills"
Documentation = "https://github.com/Aevon-sec/PenSkills#readme"
Issues = "https://github.com/Aevon-sec/PenSkills/issues"

[tool.hatch.build]
exclude = [".claude/", ".cursor/", ".agents/"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/skillspector"]
core-metadata-version = "2.4"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/skillspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that invoke the full graph (may call LLMs)",
    "provider: live OpenAI/Anthropic/NVIDIA Build provider endpoint tests",
]
addopts = "-m 'not integration and not provider'"
